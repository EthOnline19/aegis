specVersion: 0.0.5
description: BULWARK Risk Subgraph — every policy-second, tier decision, verdict, claim,
  and blocklist entry across all covered agents. A public good.
repository: https://github.com/EthOnline19/aegis
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: PolicyRegistry
    network: arc-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PolicyRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: PolicyRegistry/PolicyRegistry.wasm
      entities:
        - Policy
        - RecipientCap
      abis:
        - name: PolicyRegistry
          file: PolicyRegistry/abis/PolicyRegistry.json
      eventHandlers:
        - event: PolicyUpdated(indexed address,indexed uint32,bytes32)
          handler: handlePolicyUpdated
        - event: PolicyRevoked(indexed address,indexed uint32)
          handler: handlePolicyRevoked
  - kind: ethereum
    name: GuardAccount
    network: arc-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GuardAccount
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: PolicyRegistry/PolicyRegistry.wasm
      entities:
        - Classification
        - Hold
      abis:
        - name: GuardAccount
          file: GuardAccount/abis/GuardAccount.json
      eventHandlers:
        - event: Classified(uint8,indexed address,uint96,bytes4)
          handler: handleClassified
        - event: Held(indexed uint256,indexed address,uint96,uint64)
          handler: handleHeld
        - event: Released(indexed uint256,indexed address,uint96)
          handler: handleReleased
        - event: OwnerDecision(indexed uint256,uint8,address)
          handler: handleOwnerDecision
        - event: HoldLapsed(indexed uint256,uint64)
          handler: handleHoldLapsed
  - kind: ethereum
    name: VerdictContract
    network: arc-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VerdictContract
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: PolicyRegistry/PolicyRegistry.wasm
      entities:
        - Verdict
        - Reason
        - BlocklistEntry
        - Report
      abis:
        - name: VerdictContract
          file: VerdictContract/abis/VerdictContract.json
      eventHandlers:
        - event: VerdictAccepted(indexed bytes32,indexed address,uint8,uint96,uint8)
          handler: handleVerdictAccepted
        - event: AttemptedBreachSignal(indexed address,indexed bytes32,bytes4)
          handler: handleAttemptedBreach
  - kind: ethereum
    name: Blocklist
    network: arc-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Blocklist
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: PolicyRegistry/PolicyRegistry.wasm
      entities:
        - BlocklistEntry
        - Report
      abis:
        - name: Blocklist
          file: Blocklist/abis/Blocklist.json
      eventHandlers:
        - event: Reported(indexed address,uint8,indexed bytes32)
          handler: handleReported
        - event: Cleared(indexed address)
          handler: handleCleared
  - kind: ethereum
    name: MutualPool
    network: arc-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MutualPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: PolicyRegistry/PolicyRegistry.wasm
      entities:
        - PoolState
        - Payout
        - TrancheDeposit
      abis:
        - name: MutualPool
          file: MutualPool/abis/MutualPool.json
      eventHandlers:
        - event: Deposited(indexed address,indexed uint8,uint256,uint256)
          handler: handleDeposited
        - event: Payout(indexed address,uint96,indexed bytes32)
          handler: handlePayout
        - event: LossApplied(uint96,uint96,uint96,uint96)
          handler: handleLossApplied
        - event: PremiumRecorded(indexed address,uint96)
          handler: handlePremiumRecorded
