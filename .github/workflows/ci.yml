name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Contracts (forge build + test + slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Forge build
        working-directory: contracts
        run: forge build

      - name: Forge test
        working-directory: contracts
        run: forge test -vvv

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Slither
        working-directory: contracts
        # Phase-0 triage: findings are informational and listed, not yet
        # gate-failing. Will tighten to --fail-* once the baseline is clean.
        run: slither . --no-fail-pedantic --json slither-report.json || true

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/slither-report.json
          if-no-files-found: ignore

  typescript:
    name: TypeScript (tsc + tests, all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Forge build (generates contracts/out artifacts for the TS tests)
        working-directory: contracts
        run: forge build

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check every package
        run: |
          for p in engine sdk api record pricing hedera; do
            (cd packages/$p && bunx tsc --noEmit) || exit 1
          done

      - name: Test engine (vitest)
        run: cd packages/engine && bunx vitest run

      - name: Test SDK (vitest)
        run: cd packages/sdk && bunx vitest run

      - name: "Test API (bun test: bun:test + vitest suites)"
        run: cd packages/api && bun test

      - name: Test DEMO (vitest)
        run: cd packages/demo && bunx vitest run

      - name: Test pricing / record / hedera (bun test)
        run: |
          cd packages/pricing && bun test
          cd ../record && bun test
          cd ../hedera && bun test

      - name: Subgraphs build
        run: |
          cd packages/subgraph && bunx graph codegen && bunx graph build
          cd erc8004 && bunx graph codegen && bunx graph build
