[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 10_000
verbosity = 3

# Speed up CI runs; fuzz details live per-test
[profile.default.fuzz]
runs = 256

[profile.invariant]
runs = 128
depth = 64

[fmt]
line_length = 100
bracket_spacing = true
int_types = "preserve"
multiline_func_header = "attributes_first"
quote_style = "double"
tab_width = 4

# See more config options: https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
